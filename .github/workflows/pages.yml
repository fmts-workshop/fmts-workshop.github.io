# Deploys the site to GitHub Pages.
#
# The site is plain static HTML, so there is no build step: the repository root is
# uploaded as-is. This replaces the deprecated legacy Pages pipeline, whose deploy
# stage repeatedly stalled in `deployment_queued` and timed out.
#
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repository default for GITHUB_TOKEN is read-only, so the write scopes Pages
# needs are declared here rather than inherited.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's 10-minute default is not enough here: deployments for this
          # repo reach `deployment_in_progress` and then get aborted mid-publish even
          # though the publish itself succeeds. 30 minutes leaves ample headroom.
          timeout: 1800000
